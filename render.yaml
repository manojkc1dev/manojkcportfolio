services:
  - type: web
    name: manojkc-portfolio-api
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: api.manojkc1.com.np,.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: manojkc-portfolio-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://manojkc1.com.np
      - key: CSRF_TRUSTED_ORIGINS
        value: https://manojkc1.com.np,https://*.manojkc1.com.np
      - key: FRONTEND_URL
        value: https://manojkc1.com.np
      - key: ADMIN_LOGIN_EMAIL
        value: contactmanojkc1.com.np@gmail.com
      - key: DEFAULT_FROM_EMAIL
        value: Manoj Khatri <contact@manojkc1.com.np>
      - key: PYTHON_VERSION
        value: 3.12.0

databases:
  - name: manojkc-portfolio-db
    plan: starter
    databaseName: portfolio_db
    user: portfolio_user
