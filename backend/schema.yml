openapi: 3.0.3
info:
  title: Portfolio CMS API
  version: 1.0.0
  description: Enterprise-grade Portfolio Content Management System API with JWT authentication,
    RBAC, and comprehensive content management features.
paths:
  /api/v1/about/:
    get:
      operationId: about_list
      description: List and create about sections with standardized API responses.
      parameters:
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: show_on_homepage
        schema:
          type: boolean
      - in: query
        name: status
        schema:
          type: string
          enum:
          - archived
          - draft
          - published
        description: |-
          * `draft` - Draft
          * `published` - Published
          * `archived` - Archived
      tags:
      - about
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAboutListList'
          description: ''
    post:
      operationId: about_create
      description: List and create about sections with standardized API responses.
      tags:
      - about
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AboutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AboutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AboutRequest'
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/About'
          description: ''
  /api/v1/about/{id}/:
    get:
      operationId: about_retrieve
      description: Retrieve, update or delete an about section with standardized API
        responses.
      parameters:
      - in: path
        name: id
