<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404: Page Not Found | Manoj Khatri</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#0e0e12" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <script>
      if (window.location.pathname === '/admin' || window.location.pathname.startsWith('/admin/')) {
        window.location.replace('/lc-zadmin-cc/');
      }
    </script>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: #0e0e12;
        color: #f3f4f6;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 520px;
        width: 100%;
        background: rgba(23, 23, 30, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-family: 'JetBrains Mono', monospace;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        color: #818cf8;
        background: rgba(99, 102, 241, 0.12);
        border: 1px solid rgba(99, 102, 241, 0.3);
        padding: 4px 12px;
        border-radius: 9999px;
        margin-bottom: 20px;
      }
      .error-code {
        font-family: 'JetBrains Mono', monospace;
        font-size: 72px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: -0.04em;
        background: linear-gradient(135deg, #ffffff 30%, #818cf8 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #ffffff;
      }
      p {
        font-size: 14px;
        line-height: 1.6;
        color: #9ca3af;
        margin-bottom: 28px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 28px;
        border-radius: 12px;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
        color: #ffffff;
        background: #4f46e5;
        transition: all 0.2s ease;
      }
      .btn:hover {
        background: #4338ca;
        transform: translateY(-1px);
      }
      .footer-note {
        margin-top: 24px;
        font-size: 12px;
        color: #6b7280;
        font-family: 'JetBrains Mono', monospace;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">HTTP 404 | Resource Missing</div>
      <div class="error-code">404</div>
      <h1>Endpoint Not Found</h1>
      <p>
        The page or route you requested does not exist on this server. Check the URL or return to Manoj K.C.'s backend engineering portfolio.
      </p>
      <a href="/" class="btn">
        <span>Return to Homepage</span>
        &rarr;
      </a>
      <div class="footer-note">manojkc1.com.np</div>
    </div>
  </body>
</html>
